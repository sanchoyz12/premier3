<body>
<!-- Контейнер панорамы -->
<div id="panorama"></div>
<!-- Кнопка Fullscreen -->
<button class="fullscreen-btn" onclick="toggleFullscreen()">На весь экран</button>

<script>
    // Получаем ID квартиры из URL
    const urlParams = new URLSearchParams(window.location.search);

    // Путь к панораме
    const panoramaUrl = `assets/img/threed/type03.jpg`;
    // Инициализация панорамы
    pannellum.viewer('panorama', {
        "default": { 
            "firstScene": "gostinaya", 
            "sceneFadeDuration": 1000 
        },
        "scenes": {
            "gostinaya": {
                "type": "equirectangular",
                "panorama": "assets/img/threed/type03.jpg",

                "hotSpots": [
                    {
                        "pitch": 37,

                        "text": "Приватный уровень",
                        "sceneId": "antresol"
                    },
                    {
                        "pitch": 0,
                        "yaw": 355,
                        "type": "scene",

                ]
            },
            "antresol": {
                "type": "equirectangular",
                "panorama": "assets/img/threed/antr_type3.jpg",
                "autoLoad": true,

                "mouseZoom": true,
                "showFullscreenCtrl": true,
                "hotSpots": [
                    {
                        "pitch": -37,
                        "yaw": 220,
                        "type": "scene",
                        "text": "Помещение с кухней",
                        "sceneId": "gostinaya"
                    }
                ]
            },
            "sanusel": {
                "type": "equirectangular",
                "panorama": "assets/img/threed/sanusel_type3.jpg",
                "autoLoad": true,
                "showZoomCtrl": true,
                "mouseZoom": true,
                "showFullscreenCtrl": true,
                "hotSpots": [
                    {
                        "pitch": -7,
                        "yaw": 175,
                        "type": "scene",
                        "text": "Помещение с кухней",
                        "sceneId": "gostinaya"
                    }
                ]
            }
        }
    });
    // Фулскрин
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
</script>
</body>
